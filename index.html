<!DOCTYPE html>
<html>
    <head>
        <title>The Perfect Day</title>
        <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="container">
        <h1>The Perfect Day</h1>
        <h2>Your personalized nutrition planner</h2>
        <p>Enter your information to discover your estimated daily nutrition needs. </p>
        <form>
            <label>Age</label>
            <input type="number"
placeholder="Enter your age">
            <label>Height (cm)</label>
            <input type="number"
placeholder="Enter your height">
            <label>Weight (kg)</label>
            <input type="number"
placeholder="Enter your weight">
            <h3>Exercise level </h3>
            <select>
                <option>1 - Heavy </option>
                <option>2 - Light </option>
                <option>3 - Moderate</option>
                <option>4 - No exercise</option>
            </select>
            <h3> Your Goal </h3>
            <select>
                <option>1- Loose weight</option>
                <option>2 - Maintain </option>
                <option>3 - Gain weight</option>
            </select>
            <br>
            <button type="submit"> Create My Perfect Day </button>

        </form>
        <div class="result">
            <h2>Your Nutrition </h2>
            <p> Calories: -- kcal</p>
            <p> Protein: -- g</p>
            <p> Carbohydrates: --g</p>
            <p> Fat: -- g</p>
            <p> Water: --litres</p>
        </div>
    </div>

</body>
</html>
